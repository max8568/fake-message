<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>編輯介面試做</title>
<!--
  PROTOTYPE — 試做用，之後會丟掉。
  問題：編輯對話的介面要怎麼操作？
  三種做法，用網址 ?variant=A / B / C 或下方切換列切換。資料只存在記憶體，重新整理就回到範例。
-->
<style>
:root{--ui-bg:#F4F5F7;--ui-panel:#FFFFFF;--ui-line:#E2E4E8;--ui-text:#1F2328;--ui-sub:#6B7280;--ui-accent:#06C755;--ui-accent-ink:#FFFFFF;--ui-sel:#E8F7EE}
*{box-sizing:border-box}
body{margin:0;background:var(--ui-bg);color:var(--ui-text);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ui-line);background:#fff;border-radius:8px;padding:6px 10px}
button.primary{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-accent-ink)}
button.ghost{border-color:transparent;background:transparent}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--ui-line);border-radius:8px;padding:6px 8px;background:#fff;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ui-sub)}
label.f > *{color:var(--ui-text);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;padding:12px}
.panel h3{margin:0 0 10px;font-size:13px;color:var(--ui-sub);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.convitem{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.convitem.on{background:var(--ui-sel);border-color:#BFE8CF}
.convitem small{display:block;color:var(--ui-sub)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.av img{width:62%;height:62%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--ui-line);background:#fff;cursor:pointer}
.chip.on{border-color:var(--ui-accent);background:var(--ui-sel)}
.avpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avpick .av{cursor:pointer;border:2px solid transparent}
.avpick .av.on{border-color:var(--ui-accent)}
.hint{color:var(--ui-sub);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ui-line);margin-bottom:10px}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 10px;color:var(--ui-sub)}
.tabs button.on{border-bottom-color:var(--ui-accent);color:var(--ui-text);font-weight:600}

/* ---------- LINE 預覽（顏色、尺寸照 research/01-reference-observations.md） ---------- */
.phone{--bg:#D0D8E4;--chrome:#F8F8F8;--chromeLine:#B2B2B2;--chromeInk:#000;--accent:#1E7BF5;--mine:#8CD032;--theirs:#FFFFFF;--ink:#000;--meta:#5A6573;--name:#535F6E;--pill:#B0B8C0;--pillInk:#FFFFFF;--inputBg:#FCFCFC;--inputLine:#D7D7D7;--field:#F0F1F1;--fieldLine:#C8C8C8;--fieldInk:#999;--inputIcon:#5F6B85;
  width:440px;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;position:relative;overflow:hidden;transform-origin:top left}
.phone.dark{--bg:#121212;--chrome:#121212;--chromeLine:#1E1E1E;--chromeInk:#FFF;--accent:#FFFFFF;--mine:#595959;--theirs:#242424;--ink:#FFF;--meta:#555555;--name:#BEBEBE;--pill:#202020;--pillInk:#696969;--inputBg:#121212;--inputLine:#1C1C1C;--field:#323232;--fieldLine:#323232;--fieldInk:#ADADAD;--inputIcon:#989898}
.phone.single{height:956px;display:flex;flex-direction:column}
.status{height:55px;background:var(--chrome);display:flex;align-items:flex-end;justify-content:space-between;padding:0 44px 8px 52px;color:var(--chromeInk);font-weight:600;font-size:17px;flex:none}
.status .r{display:flex;gap:6px;align-items:center;font-size:12px}
.bars{display:flex;gap:2px;align-items:flex-end;height:12px}.bars i{width:3px;background:currentColor;border-radius:1px;opacity:.25}.bars i.on{opacity:1}
.batt{border:1.5px solid currentColor;border-radius:5px;padding:0 3px;font-size:11px;font-weight:700;min-width:28px;text-align:center;line-height:13px}
.batt.low{color:#FF3B30}
.header{height:44px;background:var(--chrome);display:flex;align-items:center;padding:0 16px 0 20px;gap:10px;flex:none;border-bottom:1px solid var(--chromeLine);color:var(--chromeInk)}
.header .back{color:var(--accent);font-size:28px;line-height:1;font-weight:300}
.header .unread{color:var(--accent);font-size:17px;margin-left:-4px}
.header .title{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header .icons{display:flex;gap:18px;color:var(--accent);font-size:19px}
.chat{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:6px 0 10px}
.phone.long .chat{padding:8px 0 16px}
.chat .inner{margin-top:auto}
.pill{display:table;margin:6px auto 4px;height:24px;line-height:24px;padding:0 12px;border-radius:12px;background:var(--pill);color:var(--pillInk);font-size:12px}
.msg{display:flex;align-items:flex-end;margin-top:10px;padding:0 10px 0 8.5px;position:relative}
.msg.cont{margin-top:4px}
.msg.mine{justify-content:flex-end}
.msg .avslot{width:30px;align-self:flex-start;margin-right:8px;flex:none}
.msg .col{display:flex;flex-direction:column;max-width:293px;min-width:0}
.msg .nm{font-size:11.5px;color:var(--name);margin:0 0 3px 2px}
.bub{background:var(--theirs);border-radius:12px;padding:7.5px 13px;font-size:17px;line-height:1.15;white-space:pre-wrap;word-break:break-word;position:relative;max-width:293px}
.mine .bub{background:var(--mine)}
.bub.tail::before{content:"";position:absolute;top:0;width:12px;height:12px;background:inherit}
.theirs .bub.tail::before{left:-5px;clip-path:polygon(0 0,100% 0,100% 100%)}
.mine .bub.tail::before{right:-5px;clip-path:polygon(0 0,100% 0,0 100%)}
.meta{font-size:11px;color:var(--meta);line-height:1.25;margin:0 4px;flex:none;white-space:nowrap}
.mine .meta{text-align:right}
.inputbar{height:85px;background:var(--inputBg);border-top:1px solid var(--inputLine);display:flex;align-items:flex-start;gap:14px;padding:9px 14px 0;flex:none;color:var(--inputIcon);font-size:22px}
.inputbar .field{flex:1;height:34px;border-radius:17px;background:var(--field);border:1px solid var(--fieldLine);display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;color:var(--fieldInk);font-size:17px}
.sel-outline{outline:2px dashed #FF7A00;outline-offset:2px;border-radius:12px}
.dragover{box-shadow:0 -3px 0 #FF7A00}

/* ---------- 共用：預覽區外框 ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.stage .frame{overflow:auto;border-radius:18px;box-shadow:0 2px 16px rgba(0,0,0,.12);background:#fff;max-width:100%}
.stage .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* ---------- Variant A ---------- */
.vA{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:14px;padding:14px;min-height:100vh;padding-bottom:80px}
.vA .composer{width:100%;max-width:460px}
.vA textarea{width:100%;resize:vertical;min-height:44px}
.pop{position:fixed;z-index:20;width:300px;background:#fff;border:1px solid var(--ui-line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px}
@media (max-width:1000px){.vA{grid-template-columns:1fr}.vA .left,.vA .right{order:2}}

/* ---------- Variant B ---------- */
.vB{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px;padding-bottom:80px}
.vB .top{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow{display:grid;grid-template-columns:22px 120px minmax(0,1fr) 150px 120px 96px 30px;gap:6px;align-items:start;padding:6px;border-radius:8px;border:1px solid transparent}
.mrow:hover{background:#FAFAFB;border-color:var(--ui-line)}
.mrow .handle{cursor:grab;color:var(--ui-sub);padding-top:6px;text-align:center}
.mrow textarea{resize:vertical;min-height:34px;width:100%}
.mhead{font-size:12px;color:var(--ui-sub);padding:0 6px}
.sepline{font-size:11px;color:var(--ui-sub);text-align:center;margin:2px 0;border-top:1px dashed var(--ui-line);padding-top:2px}
@media (max-width:1000px){.vB{grid-template-columns:1fr}.mrow{grid-template-columns:22px 1fr 1fr;}.mrow textarea{grid-column:1/-1}}

/* ---------- Variant C ---------- */
.vC{min-height:100vh;display:flex;justify-content:center;padding:60px 10px 90px}
.vC .bar{overflow-x:auto;white-space:nowrap;position:fixed;top:0;left:0;right:0;height:50px;background:#fff;border-bottom:1px solid var(--ui-line);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:10}
.vC .bar .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer{position:fixed;top:50px;bottom:0;width:320px;max-width:90vw;background:#fff;border:1px solid var(--ui-line);z-index:15;overflow:auto;padding:12px;box-shadow:0 0 30px rgba(0,0,0,.15)}
.drawer.l{left:0}.drawer.r{right:0}
.vC .msg:hover .mini{display:flex}
.mini{display:none;position:absolute;top:-14px;gap:2px;background:#fff;border:1px solid var(--ui-line);border-radius:8px;padding:2px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px;color:#222}
.mini button{padding:2px 6px;font-size:12px;border:none}
.msg.theirs .mini{left:46px}.msg.mine .mini{right:12px}
.ins{height:10px;margin:0 40px;position:relative;cursor:pointer}
.ins:hover::after{content:"＋ 在這裡插入一則";position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:11px;background:#FF7A00;color:#fff;padding:1px 8px;border-radius:8px;white-space:nowrap}
.vC .inputbar .who{width:34px;height:34px;cursor:pointer}
.vC .inputbar input{flex:1;height:34px;border-radius:17px;background:var(--field);border:1px solid var(--fieldLine);padding:0 14px;font-size:17px;color:var(--ink)}
[contenteditable]:focus{outline:2px solid #FF7A00;outline-offset:2px}


/* ---------- Variant D：A 改，輸入區併入左欄 ---------- */
.vD{display:grid;grid-template-columns:320px minmax(0,1fr) 300px;gap:14px;padding:14px;height:100vh;padding-bottom:70px}
.vD .left{display:flex;flex-direction:column;gap:14px;min-height:0}
.vD .left .list{flex:1;overflow:auto;min-height:120px}
.vD .left .composer textarea{width:100%;resize:vertical;min-height:90px}
.vD .right{overflow:auto}

/* ---------- 切換列 ---------- */
#switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:13px}
#switcher button{white-space:nowrap;background:#333;color:#fff;border:none;border-radius:999px;padding:4px 10px}
#switcher .lbl{padding:0 8px;white-space:nowrap}
#statebox{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:min(680px,94vw);max-height:50vh;overflow:auto;background:#111;color:#9FE6B4;font:12px/1.4 ui-monospace,Consolas,monospace;padding:10px;border-radius:10px;z-index:49;white-space:pre}
</style>
</head>

<div id="switcher"></div>

function newConv(mode, names, groupName) {

  return { id: nid(), mode, groupName: groupName || '', groupCount: ps.length, meId: ps[0].id, participants: ps, messages: [],

}

}

  msg(a, 1, '下午兩點信義區', T1, '21:43'); msg(a, 1, '我先買票', T1, '21:43');
  msg(a, 0, '出門了', T0, '13:20'); msg(a, 0, '大概 30 分鐘到', T0, '13:20');
  a.statusTime = '13:25';
  const b = newConv('group', ['我', '阿傑', '小美', '媽媽'], '週末烤肉');
  b.groupCount = 5;
  msg(b, 1, '這週六誰要來烤肉？', T0, '10:02'); msg(b, 2, '我可以！', T0, '10:05'); msg(b, 2, '要帶什麼嗎', T0, '10:05');
  msg(b, 3, '我負責飲料', T0, '10:11'); msg(b, 0, '我帶肉跟炭', T0, '10:12');

// ---------------- 格式 ----------------
const WD = '日一二三四五六';
function dateLabel(d, shot) {
  if (d === shot) return '今天';
  if (d === addDays(shot, -1)) return '昨天';
  const x = new Date(d + 'T00:00'), s = new Date(shot + 'T00:00');
  const md = `${x.getMonth()+1}/${x.getDate()} (週${WD[x.getDay()]})`;
  return x.getFullYear() === s.getFullYear() ? md : `${x.getFullYear()}/${md}`;
}
function timeLabel(t, h24) {
  if (!t) return '';

}

const lastMsg = c => c.messages[c.messages.length - 1];

// ---------------- LINE 預覽 ----------------
// opts.variant: 'A' | 'B' | 'C'，決定預覽裡要掛哪些互動
function previewHTML(c, opts = {}) {
  const single = c.output === 'single';
  const ms = c.messages; let html = '';
  for (let i = 0; i < ms.length; i++) {
    const m = ms[i], prev = ms[i - 1], next = ms[i + 1];
    const sep = !prev || prev.date !== m.date;
    if (sep) html += `<div class="pill">${dateLabel(m.date, c.shotDate)}</div>`;
    const same = (a, b) => a && b && a.from === b.from && a.date === b.date && a.time === b.time;
    const runStart = sep || !same(prev, m), runEnd = !same(m, next);
    const mine = m.from === c.meId, p = P(c, m.from);
    const read = mine && m.read && (c.mode === 'personal' ? '已讀' : (m.readN > 0 ? `已讀 ${m.readN}` : ''));
    const meta = runEnd ? `<div class="meta">${read ? read + '<br>' : ''}${timeLabel(m.time, c.hour24)}</div>` : '';
    const editable = opts.variant === 'C' ? ' contenteditable="plaintext-only" data-edit="' + m.id + '"' : '';
    const bub = `<div class="bub${runStart ? ' tail' : ''}"${editable}>${esc(m.text)}</div>`;
    const sel = opts.selected === m.id ? ' sel-outline' : '';
    const drag = (opts.variant === 'A' || opts.variant === 'D') ? ' draggable="true"' : '';
    const mini = opts.variant === 'C' ? `<div class="mini"><button data-act="who" data-id="${m.id}" title="換發話者">換人</button><button data-act="time" data-id="${m.id}">時間 ${m.time}</button>${mine ? `<button data-act="read" data-id="${m.id}">${m.read ? '已讀 ✓' : '未讀'}</button>` : ''}<button data-act="del" data-id="${m.id}">刪除</button><span draggable="true" style="cursor:grab;padding:2px 4px" title="拖拉排序">⠿</span></div>` : '';
    if (opts.variant === 'C' && i === 0) html += `<div class="ins" data-ins="-1"></div>`;
    html += mine
      ? `<div class="msg mine${runStart ? '' : ' cont'}" data-id="${m.id}"${drag}>${mini}${meta}<div class="col${sel}">${bub}</div></div>`
      : `<div class="msg theirs${runStart ? '' : ' cont'}" data-id="${m.id}"${drag}>${mini}<div class="avslot">${runStart ? avHTML(p.avatar, 30) : ''}</div><div class="col${sel}">${runStart && c.mode === 'group' ? `<div class="nm">${esc(p.name)}</div>` : ''}${bub}</div>${meta}</div>`;
    if (opts.variant === 'C') html += `<div class="ins" data-ins="${i}"></div>`;

  const bars = [1, 2, 3, 4].map(n => `<i class="${n <= c.signal ? 'on' : ''}" style="height:${3 + n * 2.2}px"></i>`).join('');
  const net = c.net === 'wifi' ? '<span style="font-size:13px">📶</span>' : c.net === 'none' ? '' : `<b>${c.net.toUpperCase()}</b>`;
  const status = `<div class="status"><span>${timeLabel(st, c.hour24)}${c.mute ? ' <span style="font-size:13px">🔕</span>' : ''}</span><span class="r"><span class="bars">${bars}</span>${net}<span class="batt${c.battery < 20 ? ' low' : ''}">${c.battery}</span></span></div>`;
  const header = `<div class="header"><span class="back">‹</span>${c.unread > 0 ? `<span class="unread">${c.unread}</span>` : ''}<span class="title">${esc(title(c))}</span><span class="icons">⌕ ✆ ▦ ☰</span></div>`;
  const input = opts.variant === 'C'
    ? `<div class="inputbar"><span class="who" data-act="cyclewho" title="點一下換發話者">${avHTML(P(c, opts.sender || c.meId).avatar, 34)}</span><input id="cInput" placeholder="以「${esc(P(c, opts.sender || c.meId).name)}」的身分輸入，Enter 送出"></div>`
    : (c.showInput ? `<div class="inputbar">＋ ◎ ▣<div class="field">Aa<span>☺</span></div>🎙</div>` : '');

}
function mountPreview(el, c, opts) {

function wireDrag(root, onMove) {

  root.querySelectorAll('.msg').forEach(r => {
    r.addEventListener('dragstart', e => { from = r.dataset.id; e.dataTransfer.effectAllowed = 'move'; });
    r.addEventListener('dragover', e => { e.preventDefault(); r.classList.add('dragover'); });
    r.addEventListener('dragleave', () => r.classList.remove('dragover'));
    r.addEventListener('drop', e => { e.preventDefault(); r.classList.remove('dragover'); if (from && from !== r.dataset.id) onMove(from, r.dataset.id); });
  });
}
function moveMsg(c, fromId, toId) {
  const ms = c.messages, i = ms.findIndex(m => m.id === fromId); const [m] = ms.splice(i, 1);
  ms.splice(ms.findIndex(x => x.id === toId), 0, m); touch();
}
function nextDefault(c, after) {
  const base = after || lastMsg(c);
  if (base) return { date: base.date, time: base.time };
  return { date: T0, time: `${pad(today.getHours())}:${pad(today.getMinutes())}` };
}
function addMsg(c, from, text, idx) {
  const at = idx == null ? c.messages.length : idx + 1;
  const d = nextDefault(c, c.messages[at - 1]);
  c.messages.splice(at, 0, { id: nid(), from, text, date: d.date, time: d.time, read: true, readN: Math.max(0, c.groupCount - 1) });
  touch();
}

function wirePanels(root) {
  const c = C();
  root.querySelectorAll('[data-conv]').forEach(el => el.onclick = () => { store.cur = +el.dataset.conv; render(); });
  root.querySelectorAll('[data-cl]').forEach(el => el.onclick = () => {
    const k = el.dataset.cl;
    if (k === 'newp') { store.convs.push(newConv('personal', ['我', '新朋友'])); store.cur = store.convs.length - 1; }
    if (k === 'newg') { store.convs.push(newConv('group', ['我', '朋友 A', '朋友 B'], '新群組')); store.cur = store.convs.length - 1; }
    if (k === 'dup') { const x = JSON.parse(JSON.stringify(C())); x.id = nid(); x.updated = Date.now(); store.convs.splice(store.cur + 1, 0, x); store.cur++; }
    if (k === 'del') { if (store.convs.length > 1 && confirmDel()) { store.convs.splice(store.cur, 1); store.cur = Math.max(0, store.cur - 1); } }
    if (['exp', 'expall', 'imp'].includes(k)) flash(el, '試做版不做');
    render();
  });
  root.querySelectorAll('[data-pname]').forEach(el => el.oninput = () => { P(c, el.dataset.pname).name = el.value; touch(); renderPreviewOnly(); });
  root.querySelectorAll('[data-pname]').forEach(el => el.onchange = () => render());
  root.querySelectorAll('[data-me]').forEach(el => el.onchange = () => { c.meId = el.dataset.me; touch(); render(); });
  root.querySelectorAll('[data-pickav]').forEach(el => el.onclick = () => { const [id, i] = el.dataset.pickav.split(':'); P(c, id).avatar = +i; touch(); render(); });
  root.querySelectorAll('[data-pdel]').forEach(el => el.onclick = () => { const id = el.dataset.pdel; c.participants = c.participants.filter(p => p.id !== id); c.messages = c.messages.filter(m => m.from !== id); if (c.meId === id) c.meId = c.participants[0].id; touch(); render(); });
  root.querySelectorAll('[data-padd]').forEach(el => el.onclick = () => {
    const used = new Set(c.participants.map(p => p.avatar)); let av = [...Array(12).keys()].find(i => !used.has(i)); if (av == null) av = c.participants.length % 12;
    c.participants.push({ id: nid(), name: '新成員 ' + c.participants.length, avatar: av });
    if (c.groupCount < c.participants.length) c.groupCount = c.participants.length; touch(); render();
  });
  root.querySelectorAll('[data-set]').forEach(el => {
    const apply = () => {
      const k = el.dataset.set; let v = el.type === 'checkbox' ? el.checked : el.value;
      if (k === 'hour24') v = v === 'true';
      if (['groupCount', 'battery', 'signal', 'unread'].includes(k)) v = Math.max(0, +v || 0);
      if (k === 'groupCount') v = Math.max(v, c.participants.length);
      if (k === 'battery') v = Math.min(100, v); if (k === 'unread') v = Math.min(999, v);
      c[k] = v; touch();
    };
    el.oninput = () => { apply(); renderPreviewOnly(); };
    el.onchange = () => { apply(); render(); };
  });
  root.querySelectorAll('[data-out]').forEach(el => el.onclick = () => { c.output = el.dataset.out; render(); });
}

function popA(m, rect) {

  const r = btn.getBoundingClientRect(); closePop();
  const el = document.createElement('div'); el.className = 'pop'; el.id = 'pop'; el.style.width = '240px';
  el.innerHTML = `<div class="row"><input type="date" id="tD" value="${m.date}"><input type="time" id="tT" value="${m.time}"><button class="primary" id="tOk">完成</button></div>`;
  document.body.appendChild(el); el.style.left = Math.min(window.innerWidth - 250, r.left) + 'px'; el.style.top = (r.bottom + 6) + 'px';
  const upd = () => { m.date = val('tD') || m.date; m.time = val('tT') || m.time; touch(); renderPreviewOnly(); };
  el.querySelectorAll('input').forEach(x => x.oninput = upd); document.getElementById('tOk').onclick = () => { closePop(); render(); };
}


// ---------------- Variant D：A 的操作方式，輸入區和對話清單合在左欄 ----------------
function renderD(app) {
  const c = C(); if (!c.participants.some(p => p.id === A.sender)) A.sender = c.meId;
  app.innerHTML = `<div class="vD">
    <div class="left">
      <div class="panel list"><h3>對話清單</h3>${convListHTML()}</div>
      <div class="panel composer">
        <h3>輸入訊息</h3>
        <div class="row" style="margin-bottom:8px">${c.participants.map(p => `<span class="chip${p.id === A.sender ? ' on' : ''}" data-sender="${p.id}">${avHTML(p.avatar, 24)}${esc(p.name)}${p.id === c.meId ? '（我方）' : ''}</span>`).join('')}</div>
        <textarea id="aText" placeholder="輸入訊息，Enter 送出，Shift+Enter 換行"></textarea>
        <div class="row hint" style="margin-top:6px;justify-content:space-between"><span>Tab 換下一位發話者</span><button class="primary" id="aSend">送出</button></div>
        <p class="hint" style="margin:6px 0 0">點預覽裡的訊息可以修改，拖拉可以排序</p>
      </div>
    </div>
    <div class="stage">${outTools(c)}<div class="frame" id="pv"></div></div>
    <div class="right stack"><div class="panel"><h3>參與者</h3>${participantsHTML(c)}</div><div class="panel"><h3>對話設定</h3>${settingsHTML(c)}</div></div>
  </div>`;
  renderPreviewOnly(); wirePanels(app);
  app.querySelectorAll('[data-sender]').forEach(el => el.onclick = () => { A.sender = el.dataset.sender; render(); document.getElementById('aText').focus(); });
  const ta = document.getElementById('aText');
  const send = () => { const t = ta.value.trim(); if (!t) return; addMsg(c, A.sender, t); ta.value = ''; render(); document.getElementById('aText').focus(); };
  ta.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    if (e.key === 'Tab') { e.preventDefault(); const ps = c.participants; A.sender = ps[(ps.findIndex(p => p.id === A.sender) + 1) % ps.length].id; render(); document.getElementById('aText').focus(); }
  };
  document.getElementById('aSend').onclick = send;
}

// ---------------- 繪製 ----------------
const VARIANTS = { A: ['A', '像聊天一樣輸入', renderA], B: ['B', '表單，一則一列', renderB], C: ['C', '直接在 LINE 畫面上編輯', renderC], D: ['D', 'A 改：輸入區併入左欄', renderD] };
let variant = new URLSearchParams(location.search).get('variant') || 'A'; if (!VARIANTS[variant]) variant = 'A';
let showState = false;
function renderPreviewOnly() {
  const el = document.getElementById('pv'); if (!el) return; const c = C();
  const ph = mountPreview(el, c, { variant, selected: A.sel, sender: Cv.sender });
  if (variant !== 'B') wireDrag(ph, (f, t) => { moveMsg(c, f, t); render(); });
  if (variant === 'A' || variant === 'D') ph.querySelectorAll('.msg').forEach(r => r.onclick = () => { const m = c.messages.find(x => x.id === r.dataset.id); A.sel = m.id; renderPreviewOnly(); const b = document.querySelector(`#pv .msg[data-id="${m.id}"] .bub`); popA(m, b.getBoundingClientRect()); A.sel = m.id; });
  if (variant === 'C') wireC(ph);
  ph.querySelectorAll('[data-out]').forEach(b => b.onclick = () => { c.output = b.dataset.out; render(); });
  if (showState) document.getElementById('statebox').textContent = JSON.stringify(c, null, 2);
}
function render() {
  closePop(); const app = document.getElementById('app'); VARIANTS[variant][2](app);
  app.querySelectorAll('[data-out]').forEach(b => b.onclick = () => { C().output = b.dataset.out; render(); });
  renderSwitcher();
}
function renderSwitcher() {
  const keys = Object.keys(VARIANTS), i = keys.indexOf(variant);
  const sw = document.getElementById('switcher');
  sw.innerHTML = `<button id="swPrev">←</button><span class="lbl">${variant} — ${VARIANTS[variant][1]}</span><button id="swNext">→</button><button id="swState">${showState ? '隱藏資料' : '看資料'}</button>`;
  const go = d => { variant = keys[(i + d + keys.length) % keys.length]; history.replaceState(null, '', '?variant=' + variant); render(); };
  document.getElementById('swPrev').onclick = () => go(-1); document.getElementById('swNext').onclick = () => go(1);
  document.getElementById('swState').onclick = () => { showState = !showState; let b = document.getElementById('statebox'); if (showState && !b) { b = document.createElement('div'); b.id = 'statebox'; document.body.appendChild(b); } if (!showState && b) b.remove(); render(); };
  if (showState) document.getElementById('statebox').textContent = JSON.stringify(C(), null, 2);
}
document.addEventListener('keydown', e => {
  const t = e.target; if (t.matches('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const keys = Object.keys(VARIANTS); variant = keys[(keys.indexOf(variant) + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length]; history.replaceState(null, '', '?variant=' + variant); render(); }
  if (e.key === 'Escape') closePop();
});
document.addEventListener('mousedown', e => { const p = document.getElementById('pop'); if (p && !p.contains(e.target) && !e.target.closest('.msg')) { closePop(); renderPreviewOnly(); } });
window.addEventListener('resize', () => renderPreviewOnly());
render();
</script>
