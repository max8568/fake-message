<p>照 LINE 匿名截圖的概念做的物件頭像：圖案用 Microsoft Fluent Emoji 的扁平版（MIT 授權），放在淡色圓底上。<br>前 12 個對應 LINE 的那 12 種物件，其中橡實、冰棒、海報沒有對應的圖，先用相近的代替；後 12 個是補上去湊滿 24 個的。</p>
